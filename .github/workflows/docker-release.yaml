name: docker-release

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - '*'


jobs:
  docker-build:
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zammad
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Build & Push (per‑arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-manifest:
    runs-on: ubuntu-24.04
    needs: docker-build

    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/zammad
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - name: Create multi‑arch manifest
        run: |
          docker buildx imagetools create \
            -t ${{ steps.meta.outputs.tags }} \
            ghcr.io/${{ github.repository_owner }}/zammad:$(git rev-parse --short HEAD)-amd64 \
            ghcr.io/${{ github.repository_owner }}/zammad:$(git rev-parse --short HEAD)-arm64

      - name: Inspect
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.version }}
